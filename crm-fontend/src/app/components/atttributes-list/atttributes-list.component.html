<mat-tab-group>
    <mat-tab label="Category">

        <mat-card appearance="outlined">
            <div class="card-header">

                <mat-card-header>
                    <mat-card-title>List Categories</mat-card-title>
                    <mat-card-subtitle>Place to define categories for clothes</mat-card-subtitle>
                </mat-card-header>
                <mat-card-actions>
                    <button mat-raised-button color="primary" type="submit" [routerLink]="['../category-detail']">
                        New Category
                    </button>
                </mat-card-actions>
            </div>
            <mat-card-content>
                <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
                    <!-- Position Column -->
                    <ng-container matColumnDef="position">
                        <th mat-header-cell *matHeaderCellDef>No.</th>
                        <td mat-cell *matCellDef="let element">{{element.position}}</td>
                    </ng-container>

                    <!-- Name Column -->
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef>Name</th>
                        <td mat-cell *matCellDef="let element">{{element.name}}</td>
                    </ng-container>

                    <!-- Weight Column -->
                    <ng-container matColumnDef="weight">
                        <th mat-header-cell *matHeaderCellDef>Weight</th>
                        <td mat-cell *matCellDef="let element">{{element.weight}}</td>
                    </ng-container>

                    <!-- Symbol Column -->
                    <ng-container matColumnDef="symbol">
                        <th mat-header-cell *matHeaderCellDef>Symbol</th>
                        <td mat-cell *matCellDef="let element">{{element.symbol}}</td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row (click)="clickedRows.add(row)" [class.demo-row-is-clicked]="clickedRows.has(row)"
                        *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>

                <!-- paging -->
                <mat-paginator [length]="100" [pageSize]="10" [pageSizeOptions]="[5, 10, 25, 100]"
                    aria-label="Select page">
                </mat-paginator>

            </mat-card-content>
        </mat-card>
    </mat-tab>
    <mat-tab label="Color"> Color </mat-tab>
    <mat-tab label="Size"> Size </mat-tab>
</mat-tab-group>
