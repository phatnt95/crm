<div class="top-menu-container">
    <div class="logo">
        <img src="/assets/logo_1.png" alt="">
    </div>
    <div class="center-menu">
        <button mat-button (click)="navigateTo('/home')">Home</button>
        <button mat-button (click)="navigateTo('/stock-up')">Stock Up</button>
        <button mat-button (click)="navigateTo('/organize')">Organize</button>
    </div>
    <div class="profile-container">
        <div class="search-box">
            <mat-form-field class="search-box">
                <mat-label>Search</mat-label>
                <input matInput placeholder="Search..." [(ngModel)]="searchText" />
                <button mat-icon-button matSuffix (keyup.enter)="onSearch()">
                    <mat-icon>search</mat-icon>
                </button>
            </mat-form-field>
        </div>
        <div class="profile-menu">
            <button mat-icon-button [matMenuTriggerFor]="profileMenu">
                <img src="https://i.pravatar.cc/300" class="avatar" />
            </button>
            <mat-menu #profileMenu="matMenu">
                <button mat-menu-item>Profile</button>
                <button mat-menu-item>Settings</button>
                <mat-divider></mat-divider>
                <button mat-menu-item>Logout</button>
            </mat-menu>
        </div>

    </div>
</div>

<ion-menu contentId="main-content">
    <ion-header>
        <ion-toolbar>
            <ion-title>Menu Content</ion-title>
        </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">This is the menu content.</ion-content>
</ion-menu>
<div class="ion-page" id="main-content">
    <ion-header>
        <ion-toolbar>
            <ion-buttons slot="start">
                <ion-menu-button></ion-menu-button>
            </ion-buttons>
            <ion-title>Menu</ion-title>
        </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding"> Tap the button in the toolbar to open the menu. </ion-content>
</div>
